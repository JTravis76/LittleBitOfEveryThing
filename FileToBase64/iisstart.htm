<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>IIS Windows</title>
    <style type="text/css">
      <!--
      body {
      	color:#000000;
      	background-color:#0072C6;
      	margin:0;
      }

      #container {
      	margin-left:auto;
      	margin-right:auto;
      	text-align:center;
      	}

      a img {
      	border:none;
      }

      -->
    </style>
  </head>
  <body>
    <div id="container">
      <a href="http://go.microsoft.com/fwlink/?linkid=66138&amp;clcid=0x409">
        <img src="iis.png" alt="IIS" width="960" height="600" />
      </a>
    </div>
    <div>
      <img id="img1" alt="image" src="" />
    </div>
    <script>
      fetch("IISHandler1.ashx?vApp=folder1&fileName=sample.jpg", {
        method: "GET",
        cache: "no-cache",
        mode: "no-cors",
      })
        .then((resp) => {
          if (resp.ok) {
            return resp.text();
          }
          throw new Error(resp.statusText);
        })
        .then((data) => {
          if (data !== undefined) {
            document.getElementById("img1").src = data;
          }
        })
        .catch((e) => {
          console.error(e);
        });
    </script>
  </body>
</html>
