<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Certificate Signing Server</title>
</head>
<body onload="getCerts()">
    <h1>Certificate Signing Server</h1>
    <form>
        <select></select>
        <label>pin</label>
        <input type="password" />
        <button type="button" onclick="signDoc()">Sign</button>
    </form>

    <script type="text/javascript">
        async function getCerts() {
            await fetch("./certificate/index", { method: "GET" })
                .then(resp => {
                    return resp.text();
                })
                .then(d => {
                    let el = document.getElementsByTagName("select")[0];

                    let obj = JSON.parse(d);
                    let cnt = 0;
                    obj.forEach(i => {
                        let opt = document.createElement("option");
                        opt.innerText = i;
                        opt.selected = (cnt === 0);
                        opt.value = cnt.toString();

                        el.options.add(opt);
                        cnt += 1;
                    });
                })
                .catch(err => console.error(err));
        }

        async function signDoc() {
            await fetch("./certificate/sign", { method: "POST" })
                .then(resp => {
                    return resp.text();
                })
                .then(d => {
                    console.log(d);
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
