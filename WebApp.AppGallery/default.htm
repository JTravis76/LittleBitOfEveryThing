    <!-- Modal -->
    <div id="myModal" class="modal fade" role="dialog">
        <div class="modal-dialog">
            <!-- Modal content-->
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                    <h4 class="modal-title">Application Properties</h4>
                </div>
                <div class="modal-body">

                    <label class="text-primary">Name:</label>
                    <input id="txt-name" type="text" class="form-control" />

                    <label class="text-primary">Title:</label>
                    <input id="txt-title" type="text" class="form-control" />

                    <label class="text-primary">Link:</label>
                    <input id="txt-link" type="text" class="form-control" />

                    <label class="text-primary">Icon:</label>
                    <img id="img-preview" src="Content/img/64x64.png" class="pull-right" height="64" />

                    <input id="inputFileToLoad" type="file" onchange="encodeImageFileAsURL();" />
                    <small class="text-danger">JPEG / PNG file types are supported.</small>
                    <textarea id="textarea1" class="form-control" rows="10"></textarea>

                </div>
                <div class="modal-footer">
                    <button id="btn-remove" type="button" class="btn btn-danger" data-id="0"><span class="glyphicon glyphicon-remove"></span> Remove</button>
                    <button id="btn-save" type="button" class="btn btn-success" data-id="0"><span class="glyphicon glyphicon-floppy-save"></span> Save</button>
                    <button id="btn-add" type="button" class="btn btn-success" data-id="0" style="display:none;"><span class="glyphicon glyphicon-plus-sign"></span> Add</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
