<html>
<body leftmargin="0" topmargin="0" marginheight="0" marginwidth="0">
<form name="myform">

<script>
scrn = new Array();
</script>
<script src="map.js"></script>
<script>
iconsize = 31;
scrnX = 12;
scrnY = 12;
map=0;

document.write('<table background="Images/grass.gif" cellspacing="0" cellpadding="0" border="0">');
for (i=0; i<scrnY; i++) {
 document.write('<tr>');
 for (j=0; j<scrnX ;j++) {
  document.write('<td><a href="javascript://" onClick="clickMap('+i+ ',' +j+')" onMouseOver="setTimeout(\'status=' + 'document.myform.fr'+i+'c'+j+'.value\',1);"><img name="r'+i+'c'+j+'" src="Images/no.gif" border="0"></a></td>');
  document.write('<input type="hidden" name="fr'+i+'c'+j+'" value="0">');
 }
 document.write('</tr>');
}
document.write('</table><br>');

document.write('<table background="Images/grass.gif" cellspacing="0" cellpadding="0" border="1">');

document.write('<tr>');
addIcon('Images/no', 0);
addIcon('Images/water_start_down', 1);
addIcon('Images/water_down', 1);
addIcon('Images/water_end_down', 1);
addIcon('Images/wall_start_down', 1);
addIcon('Images/wall', 0);
addIcon('Images/wall_end_down', 1);
addIcon('Images/treasure_close', 1);
addIcon('Images/block_corner', 1);
addIcon('Images/block', 1);
addIcon('Images/wall_start_down2', 1);
addIcon('Images/wall2', 0);
addIcon('Images/wall_end_down2', 1);
document.write('</tr>');

document.write('<tr>');
addIcon('Images/tree', 1);
addIcon('Images/water_left', 1);
addIcon('Images/water', 1);
addIcon('Images/water_right', 1);
addIcon('Images/wall_down_left', 1);
addIcon('Images/wall_bridge', 0);
addIcon('Images/wall_down_right', 1);
addIcon('Images/treasure_open', 1);
addIcon('Images/block2', 0);
addIcon('Images/block', 1);
addIcon('Images/wall_down_left2', 1);
addIcon('Images/key', 0);
addIcon('Images/wall_down_right2', 1);
document.write('</tr>');

document.write('<tr>');
addIcon('Images/cave', 2);
addIcon('Images/water_start_up', 1);
addIcon('Images/water_up', 1);
addIcon('Images/water_end_up', 1);
addIcon('Images/wall_start', 1);
addIcon('Images/wall_down', 1);
addIcon('Images/wall_end', 1);
addIcon('Images/wall_start2', 1);
addIcon('Images/wall_down2', 1);
addIcon('Images/wall_end2', 1);
addIcon('Images/block_corner', 1);
addIcon('Images/block_corner', 1);
addIcon('Images/block_corner', 1);
document.write('</tr>');

document.write('</table>');

function getDescr(graphic, graphictype) {
 desc = "";
 switch (graphictype) {
  case 0 : if (graphic != 'no') {desc = "0 (Road)"} else {desc = "Erase Foreground"}; break;
  case 1 : desc = "1 (Wall) "; break;
  case 2 : desc = "2 (Jump) "; break;
  default : desc = graphictype;
 }
 return desc;
}

function addIcon(graphic, graphictype) {
 document.write('<td><a href="javascript://" onClick="document.myform.icon.value=\'' + graphic + '\'; document.myform.icontype.value=\'' + graphictype + '\';"><img src="' + graphic + '.gif" height="' + iconsize + '" width="' + iconsize + '" border="0" alt="' + getDescr(graphic, graphictype) + '"></a></td>');
}

function clickMap(i,j) {
 if (document.myform.icontype.value == "?") useCustomImage();
 typenum = parseInt(document.myform.icontype.value);
 eval('document.r'+i+'c'+j+'.src=document.myform.icon.value + ".gif"');
 tmpAttr = "";
 if (typenum == 2) { 
  tmpAttr = prompt('Enter "screen number to jump to"-"x coord"-"y coord".', '1-1-1')
  if (tmpAttr != '') tmpAttr = '-' + tmpAttr
 }
 eval('document.myform.fr'+i+'c'+j+'.value="' + typenum + tmpAttr + '"');
}

function useCustomImage() {
 document.myform.icon.value = document.myform.other.value.split('/')[document.myform.other.value.split('/').length - 1].split('.')[0]
 if (document.myform.icon.value.indexOf('\\') > 0) {
  document.myform.icon.value = document.myform.other.value.split('\\')[document.myform.other.value.split('\\').length - 1].split('.')[0]
 }
 document.myform.icontype.value = prompt ('Enter icon type information. (ex. "0" for road, "1" for wall, "2-1-1-1" for jump)', '1');
}

function customImage() {
  document.myform.icontype.value = "?";
}

function readmap() {
 if (typeof(scrn[map]) == typeof(undef)) {
  alert('There is no saved map ' + map + ' in map.js');
  return;
 }
 newmap = 'scrn[' + map + '] = ""\n'
 for(i = 0; i < scrn[map].split("\n").length - 1 ; i++) {
  if (typeof(scrn[map].split("\n")[i]) != typeof(undef))
   newmap += 'scrn[' + map + '] += "' + scrn[map].split("\n")[i] + '\\n"\n'
 }
 document.myform.maptxt.value = newmap;
 showmap()
}

function savemap() {
 newmap = 'scrn[' + map + '] = ""\n';
 for(i = 0; i < scrnY; i++) {
  newmap += 'scrn[' + map + '] += "';
  for(j = 0; j < scrnX; j++) {
   graphic = ";";
   if (eval('typeof(document.r' + i + 'c' + j + '.src)') != typeof(undef)) {
    graphic = eval('document.r' + i + 'c' + j + '.src');
    graphic = graphic.split("/")[graphic.split("/").length - 1].split(".")[0] + ";";
   }
   if (graphic == 'no;') graphic = ';';
   newmap += graphic;
   if (eval('typeof(document.myform.fr' + i + 'c' + j + '.value)') != typeof(undef)) {
    newmap += eval('document.myform.fr' + i + 'c' + j + '.value') + ";";
   } else {
    newmap += ";"
   }
  }
  newmap += '\\n"\n';
 }
 document.myform.maptxt.value = newmap;
}

function showmap() {
 for(i = 0; i < scrnY; i++) {
  for(j = 0; j < scrnX; j++) {
   eval('document.r' + i + 'c' + j + '.src="Images/no.gif"');
   eval('document.myform.fr' + i + 'c' + j + '.value="0"');
   if (typeof(scrn[map].split("\n")[i]) != typeof(undef)) {
    if (scrn[map].split("\n")[i].split(";")[j*2] != "") {
     if (typeof(scrn[map].split("\n")[i].split(";")[j*2]) != typeof(undef)) {
      eval('document.r' + i + 'c' + j + '.src="Images/' + scrn[map].split("\n")[i].split(";")[j*2] + '.gif"');
      eval('document.myform.fr' + i + 'c' + j + '.value="' + scrn[map].split("\n")[i].split(";")[(j*2)+1] + '"');
     }
    }
   }
  }
 }
}

function clearmap() {
 for(i = 0; i < scrnY; i++) {
  for(j = 0; j < scrnX; j++) {
   eval('document.r' + i + 'c' + j + '.src="Images/no.gif"');
   eval('document.myform.fr' + i + 'c' + j + '.value="0"');
  }
 }
}
</script>

<input type="hidden" name="icon" value="no">
<input type="hidden" name="icontype" value="0">
<table>
 <tr>
  <td>
   <textarea name="maptxt" rows="7" cols="30" wrap="off">
   </textarea>
  </td>
  <td>
   <input type="button" value="/\" onClick="eval(document.myform.maptxt.value);showmap();">
   <br>
   <input type="button" value="\/" onClick="savemap()">
  </td>
  <td>Map: <select name="mapno" onChange="map = document.myform.mapno.selectedIndex;">');
   <script>
    for (i=0;i<=scrn.length+2;i++)
     document.write('<option value="' + i + '">' + i);
   </script>
   </select>
   &nbsp;<input type="button" value="Clear Map" onClick="clearmap()">
   <br><input type="button" value="<- Read Saved Map" onClick="readmap()">
   <br><input type="button" value="Saved Map" onClick="savemap()">
  </td>
 </tr>
</table>
<br>Use other image in same directory: <input type="file" name="other" onBlur="customImage();">
</form>

</body>
</html>

<script>
 map = document.myform.mapno.selectedIndex;
 readmap();
 showmap();
</script>
